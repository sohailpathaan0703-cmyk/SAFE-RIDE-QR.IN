<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAFE RIDE QR</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f2f4f7;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      margin-top: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    h2 {
      margin-top: 0;
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      margin-top: 18px;
      cursor: pointer;
      background: #111;
      color: white;
    }

    .call-btn {
      background: #16803c;
      margin-top: 10px;
    }

    .status {
      text-align: center;
      padding: 20px;
      font-size: 17px;
    }

    .error {
      background: #ffe5e5;
      color: #b00020;
      padding: 14px;
      border-radius: 10px;
      margin-top: 15px;
      word-break: break-word;
    }

    .success {
      background: #e5f8ea;
      color: #176b2c;
      padding: 14px;
      border-radius: 10px;
      margin-top: 15px;
    }

    .vehicle-row {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .vehicle-row strong {
      display: block;
      color: #555;
      font-size: 13px;
      margin-bottom: 3px;
    }

    .vehicle-row span {
      font-size: 18px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">
    <div class="logo">🚗 SAFE RIDE QR</div>
    <div class="subtitle">Vehicle Safety & Emergency Information</div>

    <div id="status" class="status">
      🔄 Checking QR status...
    </div>

    <div id="errorBox" class="error hidden"></div>
  </div>


  <!-- ACTIVATION FORM -->
  <div id="activationCard" class="card hidden">

    <h2>🔐 Activate Vehicle QR</h2>

    <p>
      Please enter the vehicle owner's information to activate this QR.
    </p>

    <label>Owner Name</label>
    <input id="ownerName" type="text" placeholder="Enter owner name">

    <label>Vehicle Model</label>
    <input id="vehicleModel" type="text" placeholder="e.g. Honda Activa">

    <label>Vehicle Number</label>
    <input id="vehicleNumber" type="text" placeholder="e.g. UP32AB1234">

    <label>Emergency Phone 1</label>
    <input id="phone1" type="tel" placeholder="Enter phone number">

    <label>Emergency Phone 2</label>
    <input id="phone2" type="tel" placeholder="Enter phone number">

    <label>Vehicle Type</label>
    <select id="vehicleType">
      <option value="Car">Car</option>
      <option value="Bike">Bike</option>
      <option value="Scooter">Scooter</option>
      <option value="Other">Other</option>
    </select>

    <button onclick="activateVehicle()">
      ✅ Activate QR
    </button>

    <div id="activationMessage"></div>

  </div>


  <!-- VEHICLE PROFILE -->
  <div id="profileCard" class="card hidden">

    <h2>🚗 Vehicle Information</h2>

    <div class="vehicle-row">
      <strong>QR ID</strong>
      <span id="showQrId"></span>
    </div>

    <div class="vehicle-row">
      <strong>Owner</strong>
      <span id="showOwner"></span>
    </div>

    <div class="vehicle-row">
      <strong>Vehicle</strong>
      <span id="showModel"></span>
    </div>

    <div class="vehicle-row">
      <strong>Vehicle Number</strong>
      <span id="showNumber"></span>
    </div>

    <div class="vehicle-row">
      <strong>Vehicle Type</strong>
      <span id="showType"></span>
    </div>

    <div class="vehicle-row">
      <strong>Emergency Contact 1</strong>
      <span id="showPhone1"></span>
    </div>

    <button id="call1" class="call-btn">
      📞 Call Emergency Contact 1
    </button>

    <div class="vehicle-row">
      <strong>Emergency Contact 2</strong>
      <span id="showPhone2"></span>
    </div>

    <button id="call2" class="call-btn">
      📞 Call Emergency Contact 2
    </button>

  </div>

</div>


<script>

  // =========================================
  // SUPABASE SETTINGS
  // =========================================

  const SUPABASE_URL =
    "https://kzzbinbvtzrglhbkwbtv.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_yxmdNnf4zehNaL-J1dv-CA_Imzdt6Aw";


  // =========================================
  // GLOBAL VEHICLE DATA
  // =========================================

  let currentVehicle = null;
  let currentQrId = null;


  // =========================================
  // SUPABASE REST REQUEST
  // =========================================

  async function supabaseRequest(path, options = {}) {

    const controller = new AbortController();

    const timeout = setTimeout(() => {
      controller.abort();
    }, 15000);

    try {

      const response = await fetch(
        SUPABASE_URL + "/rest/v1/" + path,
        {
          ...options,

          signal: controller.signal,

          headers: {
            "apikey": SUPABASE_KEY,
            "Content-Type": "application/json",
            ...(options.headers || {})
          }
        }
      );

      const text = await response.text();

      let data = null;

      try {
        data = text ? JSON.parse(text) : null;
      } catch {
        data = text;
      }

      if (!response.ok) {

        let message = "HTTP " + response.status;

        if (data) {
          if (typeof data === "string") {
            message += ": " + data;
          } else if (data.message) {
            message += ": " + data.message;
          } else if (data.error) {
            message += ": " + data.error;
          } else {
            message += ": " + JSON.stringify(data);
          }
        }

        throw new Error(message);
      }

      return data;

    } finally {
      clearTimeout(timeout);
    }
  }


  // =========================================
  // SHOW ERROR
  // =========================================

  function showError(message) {

    const errorBox = document.getElementById("errorBox");

    errorBox.innerText = message;
    errorBox.classList.remove("hidden");

    document.getElementById("status").classList.add("hidden");
  }


  // =========================================
  // GET QR ID FROM URL
  // =========================================

  function getQrId() {

    const params = new URLSearchParams(window.location.search);

    return params.get("id");
  }


  // =========================================
  // CHECK QR
  // =========================================

  async function checkQR() {

    try {

      currentQrId = getQrId();

      if (!currentQrId) {

        showError(
          "QR ID missing. Please scan the correct SAFE RIDE QR code."
        );

        return;
      }

      document.getElementById("status").innerText =
        "🔄 Checking QR: " + currentQrId;


      const encodedQrId = encodeURIComponent(currentQrId);


      const path =
        "Vehicles?select=*&qr_id=eq." +
        encodedQrId +
        "&limit=1";


      const data = await supabaseRequest(path);


      if (!Array.isArray(data) || data.length === 0) {

        showError(
          "QR ID not found in Vehicles table: " + currentQrId
        );

        return;
      }


      currentVehicle = data[0];


      // Support both Activated and activated
      const activatedValue =
        currentVehicle.Activated !== undefined
          ? currentVehicle.Activated
          : currentVehicle.activated;


      document.getElementById("status").classList.add("hidden");


      if (
        activatedValue === true ||
        activatedValue === "true" ||
        activatedValue === 1
      ) {

        showVehicleProfile(currentVehicle);

      } else {

        document
          .getElementById("activationCard")
          .classList.remove("hidden");

      }

    } catch (error) {

      console.error(error);

      if (error.name === "AbortError") {

        showError(
          "Request timeout. Please check your internet connection."
        );

      } else {

        showError(
          "QR check failed: " + error.message
        );

      }
    }
  }


  // =========================================
  // SHOW VEHICLE PROFILE
  // =========================================

  function showVehicleProfile(vehicle) {

    document
      .getElementById("profileCard")
      .classList.remove("hidden");


    document.getElementById("showQrId").innerText =
      vehicle.qr_id || currentQrId;


    document.getElementById("showOwner").innerText =
      vehicle.owner_name ||
      vehicle.owner ||
      "-";


    document.getElementById("showModel").innerText =
      vehicle.vehicle_model ||
      vehicle.model ||
      "-";


    document.getElementById("showNumber").innerText =
      vehicle.vehicle_number ||
      vehicle.number ||
      "-";


    document.getElementById("showType").innerText =
      vehicle.vehicle_type ||
      vehicle.type ||
      "-";


    const phone1 =
      vehicle.phone1 ||
      vehicle.emergency_phone1 ||
      vehicle.phone_1 ||
      "";


    const phone2 =
      vehicle.phone2 ||
      vehicle.emergency_phone2 ||
      vehicle.phone_2 ||
      "";


    document.getElementById("showPhone1").innerText =
      phone1 || "-";


    document.getElementById("showPhone2").innerText =
      phone2 || "-";


    const call1 =
      document.getElementById("call1");

    const call2 =
      document.getElementById("call2");


    if (phone1) {

      call1.onclick = function() {
        window.location.href =
          "tel:" + phone1;
      };

      call1.classList.remove("hidden");

    } else {

      call1.classList.add("hidden");

    }


    if (phone2) {

      call2.onclick = function() {
        window.location.href =
          "tel:" + phone2;
      };

      call2.classList.remove("hidden");

    } else {

      call2.classList.add("hidden");

    }
  }


  // =========================================
  // ACTIVATE VEHICLE
  // =========================================

  async function activateVehicle() {

    const message =
      document.getElementById("activationMessage");


    message.innerHTML =
      '<div class="status">⏳ Activating...</div>';


    try {

      if (!currentQrId) {
        throw new Error("QR ID missing.");
      }


      if (!currentVehicle) {
        throw new Error("Vehicle data not loaded.");
      }


      const ownerName =
        document.getElementById("ownerName").value.trim();


      const vehicleModel =
        document.getElementById("vehicleModel").value.trim();


      const vehicleNumber =
        document.getElementById("vehicleNumber").value.trim();


      const phone1 =
        document.getElementById("phone1").value.trim();


      const phone2 =
        document.getElementById("phone2").value.trim();


      const vehicleType =
        document.getElementById("vehicleType").value;


      if (!ownerName) {
        throw new Error("Please enter owner name.");
      }


      if (!vehicleModel) {
        throw new Error("Please enter vehicle model.");
      }


      if (!vehicleNumber) {
        throw new Error("Please enter vehicle number.");
      }


      if (!phone1) {
        throw new Error("Please enter emergency phone 1.");
      }


      // -----------------------------------------
      // DETECT ACTIVATED COLUMN
      // -----------------------------------------

      const activationColumn =
        Object.prototype.hasOwnProperty.call(
          currentVehicle,
          "Activated"
        )
          ? "Activated"
          : "activated";


      // -----------------------------------------
      // UPDATE DATA
      // -----------------------------------------

      const updateData = {

        owner_name: ownerName,

        vehicle_model: vehicleModel,

        vehicle_number: vehicleNumber,

        phone1: phone1,

        phone2: phone2,

        vehicle_type: vehicleType

      };


      updateData[activationColumn] = true;


      // -----------------------------------------
      // UPDATE SUPABASE
      // -----------------------------------------

      const path =
        "Vehicles?qr_id=eq." +
        encodeURIComponent(currentQrId);


      const updated =
        await supabaseRequest(
          path,
          {
            method: "PATCH",

            headers: {
              "Prefer": "return=representation"
            },

            body: JSON.stringify(updateData)
          }
        );


      // -----------------------------------------
      // SUCCESS
      // -----------------------------------------

      if (
        !Array.isArray(updated) ||
        updated.length === 0
      ) {

        throw new Error(
          "Vehicle update failed. Check Supabase RLS policies."
        );
      }


      currentVehicle = updated[0];


      document
        .getElementById("activationCard")
        .classList.add("hidden");


      message.innerHTML =
        '<div class="success">' +
        '✅ QR Activated Successfully!' +
        '</div>';


      showVehicleProfile(currentVehicle);


    } catch (error) {

      console.error(error);

      message.innerHTML =
        '<div class="error">' +
        "❌ Activation failed: " +
        error.message +
        "</div>";
    }
  }


  // =========================================
  // START
  // =========================================

  checkQR();

</script>

</body>
</html>
