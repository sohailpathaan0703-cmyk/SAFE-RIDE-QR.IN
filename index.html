<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safe Ride QR</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
  background:linear-gradient(145deg,#07111f,#0b1830 55%,#101f3b);
  color:#fff;
  padding:24px 16px;
}

.wrap{
  max-width:520px;
  margin:auto;
}

.logo{
  width:64px;
  height:64px;
  border-radius:18px;
  display:grid;
  place-items:center;
  margin:8px auto 14px;
  background:#fff;
  color:#081426;
  font-size:30px;
  box-shadow:0 12px 35px rgba(0,0,0,.35);
}

h1{
  text-align:center;
  font-size:28px;
}

.sub{
  text-align:center;
  color:#aebbd0;
  margin:8px 0 22px;
}

.card{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.13);
  backdrop-filter:blur(12px);
  border-radius:22px;
  padding:22px;
  box-shadow:0 18px 50px rgba(0,0,0,.25);
}

.badge{
  display:inline-block;
  background:#17345e;
  color:#bcd8ff;
  border-radius:999px;
  padding:7px 11px;
  font-size:12px;
  font-weight:bold;
  margin-bottom:18px;
}

label{
  display:block;
  margin:14px 0 7px;
  color:#dce7f7;
  font-size:14px;
}

input,
select{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.15);
  background:#0b1930;
  color:#fff;
  outline:none;
  font-size:15px;
}

input:focus,
select:focus{
  border-color:#43d9ff;
}

button{
  width:100%;
  margin-top:20px;
  padding:15px;
  border:0;
  border-radius:13px;
  background:linear-gradient(90deg,#18c8ff,#4dff9a);
  color:#06111e;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.call{
  display:block;
  width:100%;
  text-align:center;
  text-decoration:none;
  margin-top:14px;
  padding:15px;
  border-radius:13px;
  font-size:16px;
  font-weight:bold;
}

.owner{
  background:#18c8ff;
  color:#06111e;
}

.emergency{
  background:#ff4d5e;
  color:white;
}

.success{
  text-align:center;
  padding:12px;
  color:#7dffb2;
  font-weight:bold;
}

.info{
  margin:12px 0;
  padding:14px;
  border-radius:12px;
  background:rgba(255,255,255,.06);
}

.info b{
  display:block;
  color:#9fb2cc;
  font-size:12px;
  margin-bottom:4px;
}

.error{
  color:#ff8f9a;
  text-align:center;
  margin-top:15px;
  line-height:1.5;
}

.hidden{
  display:none !important;
}

.loading{
  text-align:center;
  padding:30px 10px;
  color:#bcd0e8;
}

.status{
  text-align:center;
  margin-top:12px;
  color:#aebbd0;
  font-size:13px;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="logo">🚗</div>

  <h1>SAFE RIDE QR</h1>

  <div class="sub">
    Vehicle Safety & Emergency Contact
  </div>


  <!-- LOADING -->
  <div id="loading" class="card loading">
    🔄 Checking QR status...
  </div>


  <!-- ACTIVATION FORM -->
  <div id="activationCard" class="card hidden">

    <span class="badge">
      NEW QR ACTIVATION
    </span>

    <form id="activationForm">

      <label>QR ID</label>

      <input
        id="qrId"
        name="qr_id"
        readonly
      >


      <label>Owner Name</label>

      <input
        name="owner_name"
        required
        placeholder="Enter owner name"
      >


      <label>Vehicle Model</label>

      <input
        name="vehicle_model"
        required
        placeholder="Example: Honda City"
      >


      <label>Vehicle Number</label>

      <input
        name="vehicle_number"
        required
        placeholder="Example: MH12AB1234"
      >


      <label>Owner Contact Number</label>

      <input
        name="owner_phone"
        type="tel"
        required
        placeholder="Enter owner phone"
      >


      <label>Emergency Contact Number</label>

      <input
        name="emergency_phone"
        type="tel"
        required
        placeholder="Enter emergency number"
      >


      <label>Vehicle Type</label>

      <select
        name="vehicle_type"
        required
      >
        <option value="">
          Select vehicle type
        </option>

        <option value="Car">
          Car
        </option>

        <option value="Bike">
          Bike
        </option>

        <option value="Scooter">
          Scooter
        </option>

        <option value="Auto">
          Auto
        </option>

        <option value="Truck">
          Truck
        </option>

        <option value="Bus">
          Bus
        </option>

        <option value="Other">
          Other
        </option>
      </select>


      <button
        id="activateBtn"
        type="submit"
      >
        ✅ ACTIVATE QR
      </button>


      <div
        id="formError"
        class="error"
      ></div>

    </form>

  </div>


  <!-- ACTIVATED PROFILE -->
  <div id="profileCard" class="card hidden">

    <div class="success">
      ✅ QR ACTIVATED
    </div>

    <span class="badge">
      SAFE RIDE VEHICLE PROFILE
    </span>


    <div class="info">
      <b>QR ID</b>
      <span id="showQr"></span>
    </div>


    <div class="info">
      <b>OWNER NAME</b>
      <span id="showOwner"></span>
    </div>


    <div class="info">
      <b>VEHICLE MODEL</b>
      <span id="showModel"></span>
    </div>


    <div class="info">
      <b>VEHICLE NUMBER</b>
      <span id="showNumber"></span>
    </div>


    <div class="info">
      <b>VEHICLE TYPE</b>
      <span id="showType"></span>
    </div>


    <a
      id="ownerCall"
      class="call owner"
      href="#"
    >
      📞 CALL OWNER
    </a>


    <a
      id="emergencyCall"
      class="call emergency"
      href="#"
    >
      🚨 EMERGENCY CALL
    </a>

  </div>


  <!-- PAGE ERROR -->
  <div
    id="pageError"
    class="card error hidden"
  ></div>

</div>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================
   SUPABASE CONFIG
========================= */

const SUPABASE_URL =
  "https://kzzbinbvtzrglhbkwbtv.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_yxmdNnf4zehNaL-J1dv-CA_Imzdt6Aw";


const supabase =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   READ QR ID FROM URL
========================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const qrId =
  (params.get("id") || "")
    .toUpperCase()
    .trim();


/* =========================
   ELEMENTS
========================= */

const loading =
  document.getElementById("loading");

const activationCard =
  document.getElementById("activationCard");

const profileCard =
  document.getElementById("profileCard");

const pageError =
  document.getElementById("pageError");

const qrInput =
  document.getElementById("qrId");

const activationForm =
  document.getElementById("activationForm");

const activateBtn =
  document.getElementById("activateBtn");

const formError =
  document.getElementById("formError");


/* =========================
   HIDE LOADING
========================= */

function hideLoading(){

  loading.classList.add("hidden");

}


/* =========================
   SHOW PAGE ERROR
========================= */

function showError(message){

  hideLoading();

  activationCard.classList.add("hidden");

  profileCard.classList.add("hidden");

  pageError.textContent = message;

  pageError.classList.remove("hidden");

}


/* =========================
   SHOW ACTIVATION FORM
========================= */

function showActivation(){

  hideLoading();

  pageError.classList.add("hidden");

  profileCard.classList.add("hidden");

  qrInput.value = qrId;

  activationCard.classList.remove("hidden");

}


/* =========================
   SHOW VEHICLE PROFILE
========================= */

function showProfile(vehicle){

  hideLoading();

  pageError.classList.add("hidden");

  activationCard.classList.add("hidden");


  document.getElementById("showQr").textContent =
    vehicle.qr_id || qrId;


  document.getElementById("showOwner").textContent =
    vehicle.owner_name || "Not available";


  document.getElementById("showModel").textContent =
    vehicle.vehicle_model || "Not available";


  document.getElementById("showNumber").textContent =
    vehicle.vehicle_number || "Not available";


  document.getElementById("showType").textContent =
    vehicle.vehicle_type || "Not available";


  const ownerCall =
    document.getElementById("ownerCall");

  const emergencyCall =
    document.getElementById("emergencyCall");


  if(vehicle.owner_phone){

    ownerCall.href =
      "tel:" + vehicle.owner_phone;

    ownerCall.classList.remove("hidden");

  }else{

    ownerCall.classList.add("hidden");

  }


  if(vehicle.emergency_phone){

    emergencyCall.href =
      "tel:" + vehicle.emergency_phone;

    emergencyCall.classList.remove("hidden");

  }else{

    emergencyCall.classList.add("hidden");

  }


  profileCard.classList.remove("hidden");

}


/* =========================
   CHECK QR
========================= */

async function checkQR(){

  try{

    /* QR ID CHECK */

    if(!qrId){

      showError(
        "QR ID missing. Please scan a valid Safe Ride QR."
      );

      return;

    }


    /* SHOW QR ID IN FORM */

    qrInput.value = qrId;


    /* SUPABASE QUERY */

    const result =
      await supabase
        .from("Vehicles")
        .select("*")
        .eq("qr_id", qrId)
        .limit(1)
        .maybeSingle();


    const data =
      result.data;

    const error =
      result.error;


    /* DATABASE ERROR */

    if(error){

      console.error(
        "QR CHECK ERROR:",
        error
      );

      showError(
        "QR check failed. Please try again."
      );

      return;

    }


    /* QR NOT FOUND */

    if(!data){

      showError(
        "This QR ID is not registered."
      );

      return;

    }


    /* QR FOUND */

    if(data.Activated === true){

      showProfile(data);

    }else{

      showActivation();

    }

  }catch(error){

    console.error(
      "UNEXPECTED ERROR:",
      error
    );

    showError(
      "Unable to check QR status. Please try again."
    );

  }

}


/* =========================
   ACTIVATION FORM
========================= */

activationForm.addEventListener(
  "submit",
  async function(e){

    e.preventDefault();


    /* RESET ERROR */

    formError.textContent = "";


    /* CHECK QR */

    if(!qrId){

      formError.textContent =
        "QR ID is missing.";

      return;

    }


    /* DISABLE BUTTON */

    activateBtn.disabled = true;

    activateBtn.textContent =
      "⏳ ACTIVATING...";


    try{

      const formData =
        new FormData(this);


      /* FORM VALUES */

      const ownerName =
        (formData.get("owner_name") || "")
          .toString()
          .trim();


      const vehicleModel =
        (formData.get("vehicle_model") || "")
          .toString()
          .trim();


      const vehicleNumber =
        (formData.get("vehicle_number") || "")
          .toString()
          .trim();


      const ownerPhone =
        (formData.get("owner_phone") || "")
          .toString()
          .trim();


      const emergencyPhone =
        (formData.get("emergency_phone") || "")
          .toString()
          .trim();


      const vehicleType =
        (formData.get("vehicle_type") || "")
          .toString()
          .trim();


      /* VALIDATION */

      if(
        !ownerName ||
        !vehicleModel ||
        !vehicleNumber ||
        !ownerPhone ||
        !emergencyPhone ||
        !vehicleType
      ){

        formError.textContent =
          "Please fill all required fields.";

        activateBtn.disabled = false;

        activateBtn.textContent =
          "✅ ACTIVATE QR";

        return;

      }


      /* UPDATE DATA */

      const updateData = {

        owner_name:
          ownerName,

        vehicle_model:
          vehicleModel,

        vehicle_number:
          vehicleNumber,

        owner_phone:
          ownerPhone,

        emergency_phone:
          emergencyPhone,

        vehicle_type:
          vehicleType,

        Activated:
          true

      };


      /* ACTIVATE QR */

      const result =
        await supabase
          .from("Vehicles")
          .update(updateData)
          .eq("qr_id", qrId)
          .eq("Activated", false)
          .select()
          .limit(1)
          .maybeSingle();


      const data =
        result.data;

      const error =
        result.error;


      /* UPDATE ERROR */

      if(error){

        console.error(
          "ACTIVATION ERROR:",
          error
        );

        formError.textContent =
          "Activation failed. Please try again.";

        activateBtn.disabled = false;

        activateBtn.textContent =
          "✅ ACTIVATE QR";

        return;

      }


      /* NO ROW UPDATED */

      if(!data){

        formError.textContent =
          "This QR may already be activated or is not available.";

        activateBtn.disabled = false;

        activateBtn.textContent =
          "✅ ACTIVATE QR";

        return;

      }


      /* SUCCESS */

      activationForm.reset();

      activationCard.classList.add("hidden");

      showProfile(data);


    }catch(error){

      console.error(
        "UNEXPECTED ACTIVATION ERROR:",
        error
      );

      formError.textContent =
        "Activation failed. Please try again.";

      activateBtn.disabled = false;

      activateBtn.textContent =
        "✅ ACTIVATE QR";

    }

  }
);


/* =========================
   START
========================= */

showError("TEST OK - JavaScript is working");

</script>

</body>
                             </html>
