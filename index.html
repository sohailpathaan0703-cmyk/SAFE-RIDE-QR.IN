 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAFE RIDE QR</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7f9;
  color:#222;
}
.container{
  max-width:500px;
  margin:auto;
  padding:20px;
}
.card{
  background:white;
  padding:22px;
  margin-top:20px;
  border-radius:15px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}
h1{
  text-align:center;
  color:#087f5b;
}
h2{
  margin-top:0;
}
label{
  display:block;
  margin-top:12px;
  font-weight:bold;
}
input,select{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  margin-top:6px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}
button{
  width:100%;
  padding:13px;
  margin-top:18px;
  border:0;
  border-radius:8px;
  background:#087f5b;
  color:white;
  font-size:16px;
  font-weight:bold;
}
.call{
  display:block;
  text-align:center;
  text-decoration:none;
  padding:13px;
  margin-top:12px;
  border-radius:8px;
  background:#087f5b;
  color:white;
  font-weight:bold;
}
.error{
  color:#c92a2a;
  text-align:center;
}
.success{
  color:#087f5b;
  text-align:center;
}
.info{
  margin:10px 0;
  padding:10px;
  background:#f1f3f5;
  border-radius:8px;
}
</style>
</head>

<body>

<div class="container">

<h1>SAFE RIDE QR</h1>

<div id="app" class="card">
  <p style="text-align:center;">Checking QR status...</p>
</div>

</div>

<script>

const SUPABASE_URL =
"https://kzzbinbvtzrglhbkwbtv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_yxmdNnf4zehNaL-J1dv-CA_Imzdt6Aw";


function supabaseFetch(path, options = {}) {

  return fetch(SUPABASE_URL + path, {

    ...options,

    headers: {
      "apikey": SUPABASE_KEY,
      "Content-Type": "application/json",
      ...(options.headers || {})
    }

  });

}


const params = new URLSearchParams(window.location.search);
const qrId = params.get("id");

const app = document.getElementById("app");


if (!qrId) {

  app.innerHTML = `
    <h2>Invalid QR</h2>
    <p class="error">
      QR ID not found.
    </p>
  `;

} else {

  checkQR();

}


async function checkQR() {

  try {

    const response = await supabaseFetch(
      `/rest/v1/Vehicles?qr_id=eq.${encodeURIComponent(qrId)}&select=*`
    );

    if (!response.ok) {

      throw new Error(
        "HTTP " + response.status + ": " +
        await response.text()
      );

    }

    const data = await response.json();

    if (!data.length) {

      app.innerHTML = `
        <h2>QR Not Found</h2>
        <p class="error">
          This QR code is not registered.
        </p>
      `;

      return;

    }

    const vehicle = data[0];

    if (vehicle.Activated === true) {

      showProfile(vehicle);

    } else {

      showActivationForm();

    }

  } catch (error) {

    app.innerHTML = `
      <h2>QR Check Failed</h2>
      <p class="error">
        ${escapeHTML(error.toString())}
      </p>
    `;

  }

}


function showActivationForm() {

  app.innerHTML = `

    <h2>Activate Your QR</h2>

    <p>
      Please enter the vehicle owner's information.
    </p>

    <label>Owner Name</label>
    <input id="ownerName" type="text" placeholder="Owner Name">

    <label>Vehicle Model</label>
    <input id="vehicleModel" type="text" placeholder="Vehicle Model">

    <label>Vehicle Number</label>
    <input id="vehicleNumber" type="text" placeholder="Vehicle Number">

    <label>Vehicle Type</label>
    <select id="vehicleType">
      <option value="">Select Vehicle Type</option>
      <option>Car</option>
      <option>Bike</option>
      <option>Scooter</option>
      <option>Auto</option>
      <option>Other</option>
    </select>

    <label>Owner Phone</label>
    <input id="ownerPhone" type="tel" placeholder="Owner Phone">

    <label>Emergency Phone</label>
    <input id="emergencyPhone" type="tel" placeholder="Emergency Phone">

    <button onclick="activateQR()">
      Activate QR
    </button>

    <div id="message"></div>
  `;
}


async function activateQR() {

  const ownerName =
    document.getElementById("ownerName").value.trim();

  const vehicleModel =
    document.getElementById("vehicleModel").value.trim();

  const vehicleNumber =
    document.getElementById("vehicleNumber").value.trim();

  const vehicleType =
    document.getElementById("vehicleType").value.trim();

  const ownerPhone =
    document.getElementById("ownerPhone").value.trim();

  const emergencyPhone =
    document.getElementById("emergencyPhone").value.trim();

  const message =
    document.getElementById("message");


  if (
    !ownerName ||
    !vehicleModel ||
    !vehicleNumber ||
    !vehicleType ||
    !ownerPhone ||
    !emergencyPhone
  ) {

    message.innerHTML =
      `<p class="error">Please fill all fields.</p>`;

    return;

  }


  message.innerHTML =
    `<p>Activating QR...</p>`;


  try {

    const response = await supabaseFetch(
      `/rest/v1/Vehicles?qr_id=eq.${encodeURIComponent(qrId)}`,
      {
        method: "PATCH",

        headers: {
          "Prefer": "return=representation"
        },

        body: JSON.stringify({

          Owner_name: ownerName,
          Vehicle_model: vehicleModel,
          Vehicle_number: vehicleNumber,
          Vehicle_type: vehicleType,
          Owner_phone: ownerPhone,
          Emergency_phone: emergencyPhone,
          Activated: true

        })

      }
    );


    if (!response.ok) {

      throw new Error(
        "HTTP " + response.status + ": " +
        await response.text()
      );

    }


    const updatedData = await response.json();

    if (updatedData.length) {

      showProfile(updatedData[0]);

    } else {

      await checkQR();

    }

  } catch (error) {

    message.innerHTML = `
      <p class="error">
        Activation failed:<br>
        ${escapeHTML(error.toString())}
      </p>
    `;

  }

}


function showProfile(vehicle) {

  app.innerHTML = `

    <h2>Vehicle Information</h2>

    <div class="info">
      <strong>Owner Name</strong><br>
      ${escapeHTML(vehicle.Owner_name || "-")}
    </div>

    <div class="info">
      <strong>Vehicle Model</strong><br>
      ${escapeHTML(vehicle.Vehicle_model || "-")}
    </div>

    <div class="info">
      <strong>Vehicle Number</strong><br>
      ${escapeHTML(vehicle.Vehicle_number || "-")}
    </div>

    <div class="info">
      <strong>Vehicle Type</strong><br>
      ${escapeHTML(vehicle.Vehicle_type || "-")}
    </div>

    <div class="info">
      <strong>Owner Phone</strong><br>
      ${escapeHTML(vehicle.Owner_phone || "-")}
    </div>

    <div class="info">
      <strong>Emergency Phone</strong><br>
      ${escapeHTML(vehicle.Emergency_phone || "-")}
    </div>

    ${
      vehicle.Owner_phone
      ?
      `<a class="call"
         href="tel:${encodeURIComponent(vehicle.Owner_phone)}">
         📞 Call Owner
       </a>`
      :
      ""
    }

    ${
      vehicle.Emergency_phone
      ?
      `<a class="call"
         href="tel:${encodeURIComponent(vehicle.Emergency_phone)}">
         🚨 Call Emergency Contact
       </a>`
      :
      ""
    }

  `;

}


function escapeHTML(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
