<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SAFE RIDE QR</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
  background:linear-gradient(145deg,#07111f,#0b1830 55%,#101f3b);
  color:#fff;
  padding:24px 16px;
}

.wrap{
  max-width:520px;
  margin:auto;
}

.logo{
  width:64px;
  height:64px;
  border-radius:18px;
  display:grid;
  place-items:center;
  margin:8px auto 14px;
  background:#fff;
  color:#081426;
  font-size:30px;
  box-shadow:0 12px 35px rgba(0,0,0,.35);
}

h1{
  text-align:center;
  font-size:28px;
}

.sub{
  text-align:center;
  color:#aebbd0;
  margin:8px 0 22px;
}

.card{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.13);
  backdrop-filter:blur(12px);
  border-radius:22px;
  padding:22px;
  box-shadow:0 18px 50px rgba(0,0,0,.25);
}

.badge{
  display:inline-block;
  background:#17345e;
  color:#bcd8ff;
  border-radius:999px;
  padding:7px 11px;
  font-size:12px;
  font-weight:bold;
  margin-bottom:18px;
}

label{
  display:block;
  margin:14px 0 7px;
  color:#dce7f7;
  font-size:14px;
}

input,select{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.15);
  background:#0b1930;
  color:#fff;
  outline:none;
  font-size:15px;
}

input:focus,select:focus{
  border-color:#43d9ff;
}

button{
  width:100%;
  margin-top:20px;
  padding:15px;
  border:0;
  border-radius:13px;
  background:linear-gradient(90deg,#18c8ff,#4dff9a);
  color:#06111e;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

.call{
  display:block;
  width:100%;
  text-align:center;
  text-decoration:none;
  margin-top:14px;
  padding:15px;
  border-radius:13px;
  font-size:16px;
  font-weight:bold;
}

.owner{
  background:#18c8ff;
  color:#06111e;
}

.emergency{
  background:#ff4d5e;
  color:white;
}

.success{
  text-align:center;
  padding:12px;
  color:#7dffb2;
  font-weight:bold;
}

.info{
  margin:12px 0;
  padding:14px;
  border-radius:12px;
  background:rgba(255,255,255,.06);
}

.info b{
  display:block;
  color:#9fb2cc;
  font-size:12px;
  margin-bottom:4px;
}

.error{
  color:#ff8f9a;
  text-align:center;
  margin-top:15px;
  line-height:1.5;
}

.hidden{
  display:none !important;
}

.loading{
  text-align:center;
  padding:30px 10px;
  color:#bcd0e8;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="logo">🚗</div>

  <h1>SAFE RIDE QR</h1>

  <div class="sub">
    Vehicle Safety & Emergency Contact
  </div>


  <!-- LOADING -->

  <div id="loading" class="card loading">
    🔄 Checking QR status...
  </div>


  <!-- ACTIVATION -->

  <div id="activationCard" class="card hidden">

    <span class="badge">
      NEW QR ACTIVATION
    </span>

    <form id="activationForm">

      <label>QR ID</label>

      <input
        id="qrId"
        name="qr_id"
        readonly
      >


      <label>Owner Name</label>

      <input
        name="owner_name"
        required
        placeholder="Enter owner name"
      >


      <label>Vehicle Model</label>

      <input
        name="vehicle_model"
        required
        placeholder="Example: Honda City"
      >


      <label>Vehicle Number</label>

      <input
        name="vehicle_number"
        required
        placeholder="Example: MH12AB1234"
      >


      <label>Owner Contact Number</label>

      <input
        name="owner_phone"
        type="tel"
        required
        placeholder="Enter owner phone"
      >


      <label>Emergency Contact Number</label>

      <input
        name="emergency_phone"
        type="tel"
        required
        placeholder="Enter emergency number"
      >


      <label>Vehicle Type</label>

      <select name="vehicle_type" required>

        <option value="">
          Select vehicle type
        </option>

        <option value="Car">
          Car
        </option>

        <option value="Bike">
          Bike
        </option>

        <option value="Scooter">
          Scooter
        </option>

        <option value="Auto">
          Auto
        </option>

        <option value="Truck">
          Truck
        </option>

        <option value="Bus">
          Bus
        </option>

        <option value="Other">
          Other
        </option>

      </select>


      <button
        id="activateBtn"
        type="submit"
      >
        ✅ ACTIVATE QR
      </button>


      <div
        id="formError"
        class="error"
      ></div>

    </form>

  </div>


  <!-- PROFILE -->

  <div id="profileCard" class="card hidden">

    <div class="success">
      ✅ QR ACTIVATED
    </div>

    <span class="badge">
      SAFE RIDE VEHICLE PROFILE
    </span>


    <div class="info">
      <b>QR ID</b>
      <span id="showQr"></span>
    </div>


    <div class="info">
      <b>OWNER NAME</b>
      <span id="showOwner"></span>
    </div>


    <div class="info">
      <b>VEHICLE MODEL</b>
      <span id="showModel"></span>
    </div>


    <div class="info">
      <b>VEHICLE NUMBER</b>
      <span id="showNumber"></span>
    </div>


    <div class="info">
      <b>VEHICLE TYPE</b>
      <span id="showType"></span>
    </div>


    <a
      id="ownerCall"
      class="call owner hidden"
    >
      📞 CALL OWNER
    </a>


    <a
      id="emergencyCall"
      class="call emergency hidden"
    >
      🚨 EMERGENCY CALL
    </a>

  </div>


  <!-- ERROR -->

  <div
    id="pageError"
    class="card error hidden"
  ></div>

</div>


<script>

/* =========================
   SUPABASE SETTINGS
========================= */

const SUPABASE_URL =
"https://kzzbinbvtzrglhbkwbtv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_yxmdNnf4zeHNaL-J1dv-CA_Imzdt6Aw";


/* =========================
   GET QR ID
========================= */

const params =
new URLSearchParams(
  window.location.search
);

const qrId =
(params.get("id") || "")
.toUpperCase()
.trim();


/* =========================
   ELEMENTS
========================= */

const loading =
document.getElementById("loading");

const activationCard =
document.getElementById("activationCard");

const profileCard =
document.getElementById("profileCard");

const pageError =
document.getElementById("pageError");

const qrInput =
document.getElementById("qrId");


/* =========================
   SHOW ERROR
========================= */

function showError(message){

  loading.classList.add("hidden");

  activationCard.classList.add("hidden");

  profileCard.classList.add("hidden");

  pageError.textContent = message;

  pageError.classList.remove("hidden");
}


/* =========================
   SHOW ACTIVATION FORM
========================= */

function showActivation(){

  loading.classList.add("hidden");

  pageError.classList.add("hidden");

  qrInput.value = qrId;

  activationCard.classList.remove("hidden");
}


/* =========================
   SHOW PROFILE
========================= */

function showProfile(vehicle){

  loading.classList.add("hidden");

  activationCard.classList.add("hidden");

  pageError.classList.add("hidden");


  document.getElementById("showQr").textContent =
    vehicle.qr_id || qrId;


  document.getElementById("showOwner").textContent =
    vehicle.owner_name || "Not available";


  document.getElementById("showModel").textContent =
    vehicle.vehicle_model || "Not available";


  document.getElementById("showNumber").textContent =
    vehicle.vehicle_number || "Not available";


  document.getElementById("showType").textContent =
    vehicle.vehicle_type || "Not available";


  const ownerCall =
    document.getElementById("ownerCall");

  const emergencyCall =
    document.getElementById("emergencyCall");


  if(vehicle.owner_phone){

    ownerCall.href =
      "tel:" + vehicle.owner_phone;

    ownerCall.classList.remove("hidden");

  }


  if(vehicle.emergency_phone){

    emergencyCall.href =
      "tel:" + vehicle.emergency_phone;

    emergencyCall.classList.remove("hidden");

  }


  profileCard.classList.remove("hidden");
}


/* =========================
   SUPABASE REQUEST
========================= */

async function supabaseRequest(
  url,
  options = {}
){

  const controller =
    new AbortController();

  const timeout =
    setTimeout(
      () => controller.abort(),
      10000
    );


  try{

    const response =
      await fetch(
        url,
        {
          ...options,

          signal:
            controller.signal,

          headers:{
            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " + SUPABASE_KEY,

            "Content-Type":
              "application/json",

            ...(options.headers || {})
          }
        }
      );


    const text =
      await response.text();


    let data = null;


    if(text){

      try{

        data =
          JSON.parse(text);

      }catch(e){

        data = text;

      }

    }


    if(!response.ok){

      throw new Error(
        "HTTP " +
        response.status +
        ": " +
        text
      );

    }


    return data;

  }finally{

    clearTimeout(timeout);

  }

}


/* =========================
   CHECK QR
========================= */

async function checkQR(){

  /* NO QR */

  if(!qrId){

    showError(
      "QR ID missing. Please scan a valid Safe Ride QR."
    );

    return;
  }


  try{

    /*
      Get vehicle using QR ID.
      We do NOT filter Activated here.
      So both activated and non-activated rows work.
    */

    const url =
      SUPABASE_URL +
      "/rest/v1/Vehicles" +
      "?select=*" +
      "&qr_id=eq." +
      encodeURIComponent(qrId) +
      "&limit=1";


    const data =
      await supabaseRequest(url);


    console.log(
      "QR RESULT:",
      data
    );


    if(!Array.isArray(data)){

      showError(
        "Invalid response from database."
      );

      return;
    }


    if(data.length === 0){

      showError(
        "This QR ID is not registered."
      );

      return;
    }


    const vehicle =
      data[0];


    /*
      Support Activated / activated
    */

    const activated =
      vehicle.Activated === true ||
      vehicle.Activated === "true" ||
      vehicle.activated === true ||
      vehicle.activated === "true";


    if(activated){

      showProfile(vehicle);

    }else{

      showActivation();

    }


  }catch(error){

    console.error(
      "QR ERROR:",
      error
    );


    if(error.name === "AbortError"){

      showError(
        "Database connection timed out. Please try again."
      );

    }else{

      showError(
        "QR check failed: " +
        error.message
      );

    }

  }

}


/* =========================
   ACTIVATION FORM
========================= */

document
.getElementById("activationForm")
.addEventListener(
  "submit",
  async function(e){

    e.preventDefault();


    const button =
      document.getElementById(
        "activateBtn"
      );


    const errorBox =
      document.getElementById(
        "formError"
      );


    errorBox.textContent = "";


    button.disabled = true;

    button.textContent =
      "⏳ ACTIVATING...";


    try{

      const formData =
        new FormData(this);


      const updateData = {

        owner_name:
          String(
            formData.get("owner_name") || ""
          ).trim(),

        vehicle_model:
          String(
            formData.get("vehicle_model") || ""
          ).trim(),

        vehicle_number:
          String(
            formData.get("vehicle_number") || ""
          ).trim(),

        owner_phone:
          String(
            formData.get("owner_phone") || ""
          ).trim(),

        emergency_phone:
          String(
            formData.get("emergency_phone") || ""
          ).trim(),

        vehicle_type:
          formData.get("vehicle_type"),

        Activated: true

      };


      /*
        Update vehicle by QR ID
      */

      const url =
        SUPABASE_URL +
        "/rest/v1/Vehicles" +
        "?qr_id=eq." +
        encodeURIComponent(qrId);


      const data =
        await supabaseRequest(
          url,
          {
            method:"PATCH",

            headers:{
              "Prefer":
                "return=representation"
            },

            body:
              JSON.stringify(updateData)
          }
        );


      console.log(
        "ACTIVATION RESULT:",
        data
      );


      if(
        !Array.isArray(data) ||
        data.length === 0
      ){

        throw new Error(
          "Vehicle was not updated. Check QR ID or Supabase permissions."
        );

      }


      activationCard.classList.add(
        "hidden"
      );


      showProfile(
        data[0]
      );


    }catch(error){

      console.error(
        "ACTIVATION ERROR:",
        error
      );


      errorBox.textContent =
        "Activation failed: " +
        error.message;


      button.disabled = false;

      button.textContent =
        "✅ ACTIVATE QR";

    }

  }
);


/* =========================
   START
========================= */

checkQR();

</script>

</body>
</html>
