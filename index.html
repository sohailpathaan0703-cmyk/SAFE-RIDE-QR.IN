<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Safe Ride QR</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f7fb;
  color:#172033;
}

header{
  background:#0b5ed7;
  color:white;
  padding:18px;
  text-align:center;
}

header h1{
  font-size:25px;
}

header p{
  margin-top:5px;
  opacity:.9;
}

.container{
  max-width:600px;
  margin:30px auto;
  padding:20px;
}

.card{
  background:white;
  border-radius:18px;
  padding:25px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

h2{
  margin-bottom:20px;
  color:#0b5ed7;
}

h3{
  margin:15px 0 8px;
}

label{
  display:block;
  margin-top:14px;
  margin-bottom:6px;
  font-weight:bold;
}

input,select{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  margin-top:20px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.primary{
  background:#0b5ed7;
  color:white;
}

.owner{
  background:#198754;
  color:white;
}

.emergency{
  background:#dc3545;
  color:white;
}

.info{
  background:#eef5ff;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}

.row{
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.row strong{
  display:block;
  color:#555;
  font-size:14px;
  margin-bottom:4px;
}

.status{
  text-align:center;
  padding:20px;
  font-size:18px;
}

.error{
  color:#dc3545;
  background:#fff0f0;
  padding:15px;
  border-radius:10px;
}

.success{
  color:#198754;
  background:#edfff5;
  padding:15px;
  border-radius:10px;
}

.hidden{
  display:none;
}
</style>
</head>

<body>

<header>
  <h1>SAFE RIDE QR</h1>
  <p>Vehicle Safety & Emergency Contact</p>
</header>

<div class="container">

  <!-- CHECKING -->
  <div id="checking" class="card status">
    Checking QR status...
  </div>

  <!-- ERROR -->
  <div id="errorBox" class="card hidden">
    <div class="error" id="errorText"></div>
  </div>

  <!-- ACTIVATION FORM -->
  <div id="activationBox" class="card hidden">

    <h2>Activate Your QR</h2>

    <div class="info">
      QR ID: <strong id="qrDisplay"></strong>
    </div>

    <label>Owner Name</label>
    <input id="owner_name" type="text" placeholder="Enter owner name">

    <label>Vehicle Model</label>
    <input id="vehicle_model" type="text" placeholder="Enter vehicle model">

    <label>Vehicle Number</label>
    <input id="vehicle_number" type="text" placeholder="Enter vehicle number">

    <label>Vehicle Type</label>
    <select id="vehicle_type">
      <option value="">Select vehicle type</option>
      <option value="Bike">Bike</option>
      <option value="Scooter">Scooter</option>
      <option value="Car">Car</option>
      <option value="Auto">Auto</option>
      <option value="Other">Other</option>
    </select>

    <label>Owner Phone</label>
    <input id="owner_phone" type="tel" placeholder="Enter owner phone">

    <label>Emergency Phone</label>
    <input id="emergency_phone" type="tel" placeholder="Enter emergency phone">

    <button class="primary" onclick="activateQR()">
      Activate QR
    </button>

    <div id="activationMessage"></div>

  </div>

  <!-- VEHICLE PROFILE -->
  <div id="profileBox" class="card hidden">

    <h2>Vehicle Information</h2>

    <div class="success">
      ✓ QR Activated Successfully
    </div>

    <div class="row">
      <strong>QR ID</strong>
      <span id="p_qr"></span>
    </div>

    <div class="row">
      <strong>Owner Name</strong>
      <span id="p_owner"></span>
    </div>

    <div class="row">
      <strong>Vehicle Model</strong>
      <span id="p_model"></span>
    </div>

    <div class="row">
      <strong>Vehicle Number</strong>
      <span id="p_number"></span>
    </div>

    <div class="row">
      <strong>Vehicle Type</strong>
      <span id="p_type"></span>
    </div>

    <div class="row">
      <strong>Owner Phone</strong>
      <span id="p_owner_phone"></span>
    </div>

    <div class="row">
      <strong>Emergency Phone</strong>
      <span id="p_emergency_phone"></span>
    </div>

    <button id="ownerCall" class="owner">
      📞 Call Owner
    </button>

    <button id="emergencyCall" class="emergency">
      🚨 Call Emergency Contact
    </button>

  </div>

</div>

<script>

/* ==============================
   SUPABASE SETTINGS
================================ */

const SUPABASE_URL =
"https://kzzbinbvtzrglhbkwbtv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_yxmdNnf4zehNaL-J1dv-CA_Imzdt6Aw";


/* ==============================
   QR ID
================================ */

const params = new URLSearchParams(window.location.search);

const qrId = params.get("id");


/* ==============================
   ELEMENTS
================================ */

const checking = document.getElementById("checking");
const errorBox = document.getElementById("errorBox");
const errorText = document.getElementById("errorText");
const activationBox = document.getElementById("activationBox");
const profileBox = document.getElementById("profileBox");

document.getElementById("qrDisplay").textContent = qrId || "Not Found";


/* ==============================
   SUPABASE REQUEST
================================ */

async function supabaseRequest(url, options = {}) {

  const response = await fetch(
    SUPABASE_URL + url,
    {
      ...options,

      headers:{
        "apikey": SUPABASE_KEY,
        "Content-Type":"application/json",
        ...(options.headers || {})
      }
    }
  );

  const text = await response.text();

  let data;

  try{
    data = text ? JSON.parse(text) : null;
  }catch{
    data = text;
  }

  if(!response.ok){
    throw new Error(
      "HTTP " + response.status + ": " +
      (data?.message || data?.error || text || "Request failed")
    );
  }

  return data;
}


/* ==============================
   CHECK QR
================================ */

async function checkQR(){

  if(!qrId){

    checking.classList.add("hidden");

    errorBox.classList.remove("hidden");

    errorText.textContent =
      "QR ID not found. Please scan a valid Safe Ride QR.";

    return;
  }

  try{

    const data = await supabaseRequest(
      "/rest/v1/Vehicles" +
      "?qr_id=eq." +
      encodeURIComponent(qrId) +
      "&select=*"
    );

    if(!data || data.length === 0){

      throw new Error(
        "QR ID " + qrId + " was not found."
      );
    }

    const vehicle = data[0];

    checking.classList.add("hidden");

    if(vehicle.Activated === true){

      showProfile(vehicle);

    }else{

      activationBox.classList.remove("hidden");

    }

  }catch(error){

    checking.classList.add("hidden");

    errorBox.classList.remove("hidden");

    errorText.textContent =
      "QR check failed: " + error.message;

  }

}


/* ==============================
   ACTIVATE QR
================================ */

async function activateQR(){

  const ownerName =
    document.getElementById("owner_name").value.trim();

  const vehicleModel =
    document.getElementById("vehicle_model").value.trim();

  const vehicleNumber =
    document.getElementById("vehicle_number").value.trim();

  const vehicleType =
    document.getElementById("vehicle_type").value;

  const ownerPhone =
    document.getElementById("owner_phone").value.trim();

  const emergencyPhone =
    document.getElementById("emergency_phone").value.trim();

  const message =
    document.getElementById("activationMessage");


  if(
    !ownerName ||
    !vehicleModel ||
    !vehicleNumber ||
    !vehicleType ||
    !ownerPhone ||
    !emergencyPhone
  ){

    message.innerHTML =
      '<div class="error">Please fill all fields.</div>';

    return;
  }


  message.innerHTML =
    '<div class="info">Activating QR...</div>';


  try{

    const result = await supabaseRequest(
      "/rest/v1/Vehicles?qr_id=eq." +
      encodeURIComponent(qrId),

      {
        method:"PATCH",

        headers:{
          "Prefer":"return=representation"
        },

        body:JSON.stringify({

          Owner_name: ownerName,

          Vehicle_model: vehicleModel,

          Vehicle_number: vehicleNumber,

          Owner_phone: ownerPhone,

          Emergency_phone: emergencyPhone,

          Vehicle_type: vehicleType,

          Activated: true

        })
      }
    );


    if(!result || result.length === 0){

      throw new Error(
        "QR activation failed. No database row updated."
      );

    }


    message.innerHTML =
      '<div class="success">✓ QR Activated Successfully</div>';


    setTimeout(function(){

      showProfile(result[0]);

    },800);


  }catch(error){

    message.innerHTML =
      '<div class="error">' +
      "Activation failed: " +
      error.message +
      "</div>";

  }

}


/* ==============================
   SHOW PROFILE
================================ */

function showProfile(vehicle){

  activationBox.classList.add("hidden");

  profileBox.classList.remove("hidden");


  document.getElementById("p_qr").textContent =
    vehicle.qr_id || "";

  document.getElementById("p_owner").textContent =
    vehicle.Owner_name || "";

  document.getElementById("p_model").textContent =
    vehicle.Vehicle_model || "";

  document.getElementById("p_number").textContent =
    vehicle.Vehicle_number || "";

  document.getElementById("p_type").textContent =
    vehicle.Vehicle_type || "";

  document.getElementById("p_owner_phone").textContent =
    vehicle.Owner_phone || "";

  document.getElementById("p_emergency_phone").textContent =
    vehicle.Emergency_phone || "";


  document.getElementById("ownerCall").onclick =
    function(){

      if(vehicle.Owner_phone){

        window.location.href =
          "tel:" + vehicle.Owner_phone;

      }

    };


  document.getElementById("emergencyCall").onclick =
    function(){

      if(vehicle.Emergency_phone){

        window.location.href =
          "tel:" + vehicle.Emergency_phone;

      }

    };

}


/* ==============================
   START
================================ */

checkQR();

</script>

</body>
</html>
