<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAFE RIDE QR</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f7fb;
  color:#111827;
}

header{
  background:#111827;
  color:white;
  padding:18px;
  text-align:center;
}

header h1{
  font-size:26px;
}

.container{
  max-width:600px;
  margin:30px auto;
  padding:20px;
}

.card{
  background:white;
  border-radius:16px;
  padding:25px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

h2{
  margin-bottom:15px;
}

p{
  margin:8px 0;
  line-height:1.5;
}

label{
  display:block;
  margin-top:15px;
  margin-bottom:6px;
  font-weight:bold;
}

input,select{
  width:100%;
  padding:13px;
  border:1px solid #d1d5db;
  border-radius:9px;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  margin-top:18px;
  border:0;
  border-radius:10px;
  background:#111827;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button.call{
  background:#16a34a;
}

button.emergency{
  background:#dc2626;
}

.status{
  text-align:center;
  padding:25px;
  font-size:18px;
}

.error{
  color:#dc2626;
  font-weight:bold;
}

.success{
  color:#16a34a;
  font-weight:bold;
}

.info{
  background:#eef6ff;
  padding:15px;
  border-radius:10px;
  margin:15px 0;
}

.hidden{
  display:none;
}

.profile-row{
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.profile-row strong{
  display:block;
  color:#6b7280;
  font-size:14px;
  margin-bottom:3px;
}
</style>
</head>

<body>

<header>
  <h1>SAFE RIDE QR</h1>
  <p>Vehicle Safety & Emergency Contact</p>
</header>

<div class="container">

  <!-- CHECKING -->
  <div id="loading" class="card status">
    Checking QR status...
  </div>

  <!-- ERROR -->
  <div id="errorBox" class="card status hidden">
    <div class="error" id="errorText"></div>
  </div>

  <!-- ACTIVATION -->
  <div id="activationBox" class="card hidden">

    <h2>Activate Your Safe Ride QR</h2>

    <div class="info">
      <b>QR ID:</b>
      <span id="qrDisplay"></span>
    </div>

    <label>Owner Name</label>
    <input id="owner_name" type="text" placeholder="Enter owner name">

    <label>Vehicle Model</label>
    <input id="vehicle_model" type="text" placeholder="Example: Honda Activa">

    <label>Vehicle Number</label>
    <input id="vehicle_number" type="text" placeholder="Example: MH12AB1234">

    <label>Owner Phone</label>
    <input id="owner_phone" type="tel" placeholder="10 digit mobile number">

    <label>Emergency Phone</label>
    <input id="emergency_phone" type="tel" placeholder="Emergency contact number">

    <label>Vehicle Type</label>
    <select id="vehicle_type">
      <option value="">Select Vehicle Type</option>
      <option value="Bike">Bike</option>
      <option value="Scooter">Scooter</option>
      <option value="Car">Car</option>
      <option value="Other">Other</option>
    </select>

    <button onclick="activateQR()">Activate QR</button>

    <div id="activationMessage" class="status hidden"></div>

  </div>

  <!-- PROFILE -->
  <div id="profileBox" class="card hidden">

    <h2>🚗 Safe Ride Vehicle</h2>

    <div class="success" style="margin-bottom:15px;">
      ✓ QR Activated
    </div>

    <div class="profile-row">
      <strong>Owner Name</strong>
      <span id="p_owner"></span>
    </div>

    <div class="profile-row">
      <strong>Vehicle Model</strong>
      <span id="p_model"></span>
    </div>

    <div class="profile-row">
      <strong>Vehicle Number</strong>
      <span id="p_number"></span>
    </div>

    <div class="profile-row">
      <strong>Vehicle Type</strong>
      <span id="p_type"></span>
    </div>

    <button class="call" id="ownerCall">
      📞 Call Vehicle Owner
    </button>

    <button class="emergency" id="emergencyCall">
      🚨 Call Emergency Contact
    </button>

  </div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbzLHzdUvfiBJIYN3hIykz_oZDi9mRdijn4dCIRotzbnfyNfxtc4uF7fsFrTzeoeefbBpw/exec";

let QR_ID = "";


/* GET QR ID FROM URL */
function getQRId(){

  const params = new URLSearchParams(window.location.search);

  return params.get("id");

}


/* SHOW ERROR */
function showError(message){

  document.getElementById("loading").classList.add("hidden");

  document.getElementById("activationBox").classList.add("hidden");

  document.getElementById("profileBox").classList.add("hidden");

  document.getElementById("errorBox").classList.remove("hidden");

  document.getElementById("errorText").innerText = message;

}


/* CHECK QR */
async function checkQR(){

  QR_ID = getQRId();

  if(!QR_ID){

    showError("QR ID not found. Please scan a valid Safe Ride QR.");

    return;
  }

  document.getElementById("qrDisplay").innerText = QR_ID;

  try{

    const response = await fetch(
      API_URL + "?id=" + encodeURIComponent(QR_ID),
      {
        method:"GET",
        cache:"no-store"
      }
    );

    if(!response.ok){
      throw new Error("HTTP " + response.status);
    }

    const result = await response.json();

    console.log("API RESULT:", result);

    if(!result.success){

      showError(result.message || "QR ID not found.");

      return;
    }

    const data = result.data;

    document.getElementById("loading").classList.add("hidden");

    /*
      Google Sheet may return TRUE as boolean
      or "TRUE" as text.
    */

    const activated =
      data.activated === true ||
      String(data.activated).toUpperCase() === "TRUE";

    if(activated){

      showProfile(data);

    }else{

      document
        .getElementById("activationBox")
        .classList.remove("hidden");

    }

  }catch(error){

    console.error(error);

    showError(
      "QR check failed: " + error.message
    );

  }

}


/* SHOW PROFILE */
function showProfile(data){

  document
    .getElementById("profileBox")
    .classList.remove("hidden");

  document.getElementById("p_owner").innerText =
    data.owner_name || "-";

  document.getElementById("p_model").innerText =
    data.vehicle_model || "-";

  document.getElementById("p_number").innerText =
    data.vehicle_number || "-";

  document.getElementById("p_type").innerText =
    data.vehicle_type || "-";

  const ownerPhone = data.owner_phone || "";
  const emergencyPhone = data.emergency_phone || "";

  document.getElementById("ownerCall").onclick =
    function(){

      if(ownerPhone){

        window.location.href =
          "tel:" + ownerPhone;

      }else{

        alert("Owner phone number not available.");

      }

    };

  document.getElementById("emergencyCall").onclick =
    function(){

      if(emergencyPhone){

        window.location.href =
          "tel:" + emergencyPhone;

      }else{

        alert("Emergency phone number not available.");

      }

    };

}


/* ACTIVATE QR */
async function activateQR(){

  const owner_name =
    document.getElementById("owner_name").value.trim();

  const vehicle_model =
    document.getElementById("vehicle_model").value.trim();

  const vehicle_number =
    document.getElementById("vehicle_number").value.trim();

  const owner_phone =
    document.getElementById("owner_phone").value.trim();

  const emergency_phone =
    document.getElementById("emergency_phone").value.trim();

  const vehicle_type =
    document.getElementById("vehicle_type").value;

  const message =
    document.getElementById("activationMessage");

  if(
    !owner_name ||
    !vehicle_model ||
    !vehicle_number ||
    !owner_phone ||
    !emergency_phone ||
    !vehicle_type
  ){

    message.classList.remove("hidden");

    message.className = "status error";

    message.innerText =
      "Please fill all details.";

    return;
  }

  message.classList.remove("hidden");

  message.className = "status";

  message.innerText =
    "Activating QR... Please wait.";

  const payload = {

    qr_id: QR_ID,

    owner_name: owner_name,

    vehicle_model: vehicle_model,

    vehicle_number: vehicle_number,

    owner_phone: owner_phone,

    emergency_phone: emergency_phone,

    vehicle_type: vehicle_type

  };


  try{

    const response = await fetch(
      API_URL,
      {
        method:"POST",
        headers:{
          "Content-Type":"text/plain;charset=utf-8"
        },
        body:JSON.stringify(payload)
      }
    );

    const result = await response.json();

    console.log("ACTIVATION RESULT:", result);

    if(!result.success){

      throw new Error(
        result.message || "Activation failed"
      );

    }

    message.className = "status success";

    message.innerText =
      "✓ QR activated successfully!";

    setTimeout(function(){

      location.reload();

    },1500);


  }catch(error){

    console.error(error);

    message.className = "status error";

    message.innerText =
      "Activation failed: " + error.message;

  }

}


/* START */
checkQR();

</script>

</body>
</html>
