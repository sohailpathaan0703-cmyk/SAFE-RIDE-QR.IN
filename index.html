<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAFE RIDE QR</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f2f4f7;
  color: #222;
}

.container {
  max-width: 500px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 22px;
  margin-top: 20px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

h1, h2 {
  margin-top: 0;
}

.logo {
  text-align: center;
  font-size: 30px;
  font-weight: bold;
}

.subtitle {
  text-align: center;
  color: #666;
  margin-bottom: 20px;
}

label {
  display: block;
  margin-top: 14px;
  margin-bottom: 6px;
  font-weight: bold;
}

input, select {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  font-size: 17px;
  font-weight: bold;
  margin-top: 18px;
  cursor: pointer;
  background: #111;
  color: white;
}

.call-btn {
  background: #16803c;
  margin-top: 10px;
}

.status {
  text-align: center;
  padding: 20px;
  font-size: 17px;
}

.error {
  background: #ffe5e5;
  color: #b00020;
  padding: 14px;
  border-radius: 10px;
  margin-top: 15px;
  word-break: break-word;
}

.success {
  background: #e5f8ea;
  color: #176b2c;
  padding: 14px;
  border-radius: 10px;
  margin-top: 15px;
}

.vehicle-row {
  padding: 12px 0;
  border-bottom: 1px solid #eee;
}

.vehicle-row strong {
  display: block;
  color: #555;
  font-size: 13px;
  margin-bottom: 3px;
}

.vehicle-row span {
  font-size: 18px;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<div class="container">

  <div class="card">
    <div class="logo">🚗 SAFE RIDE QR</div>
    <div class="subtitle">
      Vehicle Safety & Emergency Information
    </div>

    <div id="status" class="status">
      🔄 Checking QR status...
    </div>

    <div id="errorBox" class="error hidden"></div>
  </div>


  <!-- ACTIVATION FORM -->
  <div id="activationCard" class="card hidden">

    <h2>🔐 Activate Vehicle QR</h2>

    <p>
      Please enter the vehicle owner's information to activate this QR.
    </p>

    <label>Owner Name</label>
    <input id="ownerName" type="text"
           placeholder="Enter owner name">

    <label>Vehicle Model</label>
    <input id="vehicleModel" type="text"
           placeholder="e.g. Kia Seltos">

    <label>Vehicle Number</label>
    <input id="vehicleNumber" type="text"
           placeholder="e.g. TS15EG7484">

    <label>Owner Phone</label>
    <input id="ownerPhone" type="tel"
           placeholder="Enter owner phone">

    <label>Emergency Phone</label>
    <input id="emergencyPhone" type="tel"
           placeholder="Enter emergency phone">

    <label>Vehicle Type</label>
    <select id="vehicleType">
      <option value="Car">Car</option>
      <option value="Bike">Bike</option>
      <option value="Scooter">Scooter</option>
      <option value="Other">Other</option>
    </select>

    <button onclick="activateVehicle()">
      ✅ Activate QR
    </button>

    <div id="activationMessage"></div>

  </div>


  <!-- VEHICLE PROFILE -->
  <div id="profileCard" class="card hidden">

    <h2>🚗 Vehicle Information</h2>

    <div class="vehicle-row">
      <strong>QR ID</strong>
      <span id="showQrId"></span>
    </div>

    <div class="vehicle-row">
      <strong>Owner</strong>
      <span id="showOwner"></span>
    </div>

    <div class="vehicle-row">
      <strong>Vehicle</strong>
      <span id="showModel"></span>
    </div>

    <div class="vehicle-row">
      <strong>Vehicle Number</strong>
      <span id="showNumber"></span>
    </div>

    <div class="vehicle-row">
      <strong>Vehicle Type</strong>
      <span id="showType"></span>
    </div>

    <div class="vehicle-row">
      <strong>Owner Phone</strong>
      <span id="showOwnerPhone"></span>
    </div>

    <button id="callOwner" class="call-btn">
      📞 Call Owner
    </button>

    <div class="vehicle-row">
      <strong>Emergency Phone</strong>
      <span id="showEmergencyPhone"></span>
    </div>

    <button id="callEmergency" class="call-btn">
      🚨 Call Emergency Contact
    </button>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://kzzbinbvtzrglhbkwbtv.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_yxmdNnf4zehNaL-J1dv-CA_Imzdt6Aw";


let currentVehicle = null;
let currentQrId = null;


// ========================================
// SUPABASE REQUEST
// ========================================

async function supabaseRequest(path, options = {}) {

  const controller = new AbortController();

  const timeout = setTimeout(() => {
    controller.abort();
  }, 15000);

  try {

    const response = await fetch(
      SUPABASE_URL + "/rest/v1/" + path,
      {
        ...options,

        signal: controller.signal,

        headers: {
          "apikey": SUPABASE_KEY,
          "Content-Type": "application/json",
          ...(options.headers || {})
        }
      }
    );

    const text = await response.text();

    let data;

    try {
      data = text ? JSON.parse(text) : null;
    } catch {
      data = text;
    }

    if (!response.ok) {

      let message =
        "HTTP " + response.status;

      if (data) {

        if (typeof data === "string") {
          message += ": " + data;
        }
        else if (data.message) {
          message += ": " + data.message;
        }
        else if (data.error) {
          message += ": " + data.error;
        }
        else {
          message += ": " + JSON.stringify(data);
        }
      }

      throw new Error(message);
    }

    return data;

  } finally {

    clearTimeout(timeout);
  }
}


// ========================================
// ERROR
// ========================================

function showError(message) {

  const errorBox =
    document.getElementById("errorBox");

  errorBox.innerText = message;
  errorBox.classList.remove("hidden");

  document
    .getElementById("status")
    .classList.add("hidden");
}


// ========================================
// GET QR ID
// ========================================

function getQrId() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("id");
}


// ========================================
// CHECK QR
// ========================================

async function checkQR() {

  try {

    currentQrId = getQrId();

    if (!currentQrId) {

      showError(
        "QR ID missing. Please scan the correct SAFE RIDE QR code."
      );

      return;
    }


    document.getElementById("status").innerText =
      "🔄 Checking QR: " + currentQrId;


    const path =
      "Vehicles?select=*&qr_id=eq." +
      encodeURIComponent(currentQrId) +
      "&limit=1";


    const data =
      await supabaseRequest(path);


    if (!Array.isArray(data) ||
        data.length === 0) {

      showError(
        "QR ID not found: " + currentQrId
      );

      return;
    }


    currentVehicle = data[0];


    document
      .getElementById("status")
      .classList.add("hidden");


    if (currentVehicle.Activated === true) {

      showVehicleProfile(
        currentVehicle
      );

    } else {

      document
        .getElementById("activationCard")
        .classList.remove("hidden");
    }


  } catch (error) {

    console.error(error);

    if (error.name === "AbortError") {

      showError(
        "Request timeout. Please check your internet connection."
      );

    } else {

      showError(
        "QR check failed: " +
        error.message
      );
    }
  }
}


// ========================================
// SHOW PROFILE
// ========================================

function showVehicleProfile(vehicle) {

  document
    .getElementById("profileCard")
    .classList.remove("hidden");


  document.getElementById("showQrId").innerText =
    vehicle.qr_id || "-";


  document.getElementById("showOwner").innerText =
    vehicle.Owner_name || "-";


  document.getElementById("showModel").innerText =
    vehicle.Vehicle_model || "-";


  document.getElementById("showNumber").innerText =
    vehicle.Vehicle_number || "-";


  document.getElementById("showType").innerText =
    vehicle.Vehicle_type || "-";


  document.getElementById("showOwnerPhone").innerText =
    vehicle.Owner_phone || "-";


  document.getElementById("showEmergencyPhone").innerText =
    vehicle.Emergency_phone || "-";


  const ownerPhone =
    vehicle.Owner_phone || "";

  const emergencyPhone =
    vehicle.Emergency_phone || "";


  const ownerButton =
    document.getElementById("callOwner");

  const emergencyButton =
    document.getElementById("callEmergency");


  if (ownerPhone) {

    ownerButton.onclick = function() {

      window.location.href =
        "tel:" + ownerPhone;

    };

    ownerButton.classList.remove("hidden");

  } else {

    ownerButton.classList.add("hidden");
  }


  if (emergencyPhone) {

    emergencyButton.onclick = function() {

      window.location.href =
        "tel:" + emergencyPhone;

    };

    emergencyButton.classList.remove("hidden");

  } else {

    emergencyButton.classList.add("hidden");
  }
}


// ========================================
// ACTIVATE VEHICLE
// ========================================

async function activateVehicle() {

  const message =
    document.getElementById(
      "activationMessage"
    );


  message.innerHTML =
    '<div class="status">⏳ Activating...</div>';


  try {

    const ownerName =
      document.getElementById(
        "ownerName"
      ).value.trim();


    const vehicleModel =
      document.getElementById(
        "vehicleModel"
      ).value.trim();


    const vehicleNumber =
      document.getElementById(
        "vehicleNumber"
      ).value.trim();


    const ownerPhone =
      document.getElementById(
        "ownerPhone"
      ).value.trim();


    const emergencyPhone =
      document.getElementById(
        "emergencyPhone"
      ).value.trim();


    const vehicleType =
      document.getElementById(
        "vehicleType"
      ).value;


    if (!ownerName)
      throw new Error("Please enter owner name.");

    if (!vehicleModel)
      throw new Error("Please enter vehicle model.");

    if (!vehicleNumber)
      throw new Error("Please enter vehicle number.");

    if (!ownerPhone)
      throw new Error("Please enter owner phone.");

    if (!emergencyPhone)
      throw new Error("Please enter emergency phone.");


    // EXACT DATABASE COLUMN NAMES
    const updateData = {

      Owner_name: ownerName,

      Vehicle_model: vehicleModel,

      Vehicle_number: vehicleNumber,

      Owner_phone: ownerPhone,

      Emergency_phone: emergencyPhone,

      Vehicle_type: vehicleType,

      Activated: true
    };


    const path =
      "Vehicles?qr_id=eq." +
      encodeURIComponent(currentQrId);


    const updated =
      await supabaseRequest(
        path,
        {
          method: "PATCH",

          headers: {
            "Prefer": "return=representation"
          },

          body: JSON.stringify(updateData)
        }
      );


    if (!Array.isArray(updated) ||
        updated.length === 0) {

      throw new Error(
        "Vehicle update failed. Please check RLS policies."
      );
    }


    currentVehicle = updated[0];


    document
      .getElementById("activationCard")
      .classList.add("hidden");


    message.innerHTML =
      '<div class="success">' +
      '✅ QR Activated Successfully!' +
      '</div>';


    showVehicleProfile(
      currentVehicle
    );


  } catch (error) {

    console.error(error);

    message.innerHTML =
      '<div class="error">' +
      '❌ Activation failed: ' +
      error.message +
      '</div>';
  }
}


// START
checkQR();

</script>

</body>
</html>
